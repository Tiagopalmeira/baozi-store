spring.application.name=baozi-store

# Porta 8081 (a 8080 ja esta ocupada pelo Apache nesta maquina)
server.port=8081

# Banco relacional H2 salvo em arquivo (os dados continuam apos reiniciar a API)
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.username=sa
spring.datasource.password=

# O JPA cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
